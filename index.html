<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LCL H的百宝箱</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 20px}
  .header{width:100%;max-width:1000px;margin-bottom:24px;display:flex;align-items:center}
  .header h1{font-size:2rem;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:12px;user-select:none}
  .secret-trigger{cursor:pointer}
  .main-layout{width:100%;max-width:1000px;display:grid;grid-template-columns:260px 1fr;gap:20px;min-height:500px}
  .tree-panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;overflow-y:auto;max-height:75vh}
  .tree-title{font-size:.8rem;font-weight:600;color:#94a3b8;margin-bottom:12px;padding-left:8px}
  .tree-node-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-size:.95rem;color:#334155;transition:background .15}
  .tree-node-row:hover{background:#f1f5f9}
  .tree-node-row.active{background:#e0f2fe;color:#0284c7;font-weight:500}
  .tree-node-row .arrow{width:16px;font-size:.7rem;color:#94a3b8;text-align:center;transition:transform .2}
  .tree-node-row .arrow.expanded{transform:rotate(90deg)}
  .tree-node-row img{width:18px;height:18px;object-fit:contain}
  .tree-children{margin-left:16px;border-left:1px dashed #cbd5e1;padding-left:8px}
  .tree-children.hidden{display:none}
  .content-panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;overflow-y:auto;max-height:75vh}
  .content-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f1f5f9}
  .content-header img{width:32px;height:32px;object-fit:contain}
  .content-header h2{font-size:1.3rem;color:#0f172a}
  .link-row{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:12px;background:#f8fafc;margin-bottom:10px;border:1px solid #e2e8f0;gap:12px;flex-wrap:wrap}
  .link-info{flex:1;min-width:200px}
  .link-name{font-weight:600;font-size:1rem;color:#1e293b;margin-bottom:4px}
  .link-size{font-size:.85rem;color:#64748b}
  .link-actions{display:flex;gap:8px}
  .link-actions button{padding:8px 16px;border-radius:8px;font-size:.85rem;cursor:pointer;border:none;transition:all .15}
  .btn-copy{background:#eff6ff;color:#2563eb;font-weight:500}
  .btn-copy:hover{background:#dbeafe}
  .hint{font-size:.75rem;color:#94a3b8;margin-top:8px;width:100%}
  .result-area{display:none;width:100%;max-width:1000px;background:#fff;border-radius:16px;padding:24px;border:1px solid #e2e8f0;margin-bottom:24px}
  .result-area.show{display:block}
  .admin-view{display:none;width:100%;max-width:1000px;flex-direction:column;gap:20px}
  body.admin-mode .main-layout{display:none}
  body.admin-mode .result-area{display:none!important}
  body.admin-mode .admin-view{display:flex}
  body.admin-mode .header h1::after{content:' (管理面板)';font-size:1.1rem;color:#ef4444}
  .admin-toolbar{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:16px 20px;border-radius:12px;border:1px solid #e2e8f0}
  .admin-actions{display:flex;gap:10px}
  .admin-code-card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:20px}
  .admin-code-header{display:flex;gap:12px;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px dashed #e2e8f0;flex-wrap:wrap}
  .admin-code-header input[type=text]{padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;outline:none}
  .admin-code-header .code-input{font-weight:600;color:#ef4444;width:120px}
  .admin-code-header .title-input{flex:1;font-weight:500;color:#0f172a;min-width:150px}
  .icon-picker-btn{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc;cursor:pointer;font-size:.85rem}
  .icon-picker-btn img{width:20px;height:20px;object-fit:contain}
  .admin-link-edit-row{display:grid;grid-template-columns:1fr 80px 2fr 36px;gap:8px;margin-bottom:8px}
  .admin-link-edit-row input{padding:8px;border:1px solid #cbd5e1;border-radius:6px;font-size:.85rem;outline:none}
  .btn-small{padding:6px 12px;border-radius:6px;font-size:.85rem;cursor:pointer;border:1px solid transparent}
  .btn-primary{background:#3b82f6;color:#fff}
  .btn-secondary{background:#f1f5f9;color:#334155;border-color:#cbd5e1}
  .btn-danger{background:#fee2e2;color:#dc2626;border-color:#fecaca}
  .btn-icon{background:#fee2e2;color:#dc2626;border:none;border-radius:6px;cursor:pointer;font-size:1.1rem}
  .icons-editor{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:16px}
  .icons-editor textarea{width:100%;min-height:80px;padding:10px;border-radius:8px;border:1px solid #cbd5e1;font-family:monospace;font-size:.85rem;outline:none;resize:vertical}
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:center;z-index:1000}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:400px;text-align:center}
  .modal h3{margin-bottom:20px;font-size:1.1rem}
  .modal input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:16px;outline:none}
  .modal .btn-row{display:flex;justify-content:center;gap:10px}
  .modal .btn-row button{padding:10px 24px;border-radius:8px;border:none;font-size:.95rem;cursor:pointer}
  .modal.wide{max-width:600px;text-align:left}
  .icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:12px;max-height:400px;overflow-y:auto;padding:4px}
  .icon-grid-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border-radius:10px;border:2px solid #e2e8f0;cursor:pointer;transition:all .2}
  .icon-grid-item:hover{border-color:#93c5fd;background:#eff6ff}
  .icon-grid-item.selected{border-color:#3b82f6;background:#dbeafe}
  .icon-grid-item img{width:40px;height:40px;object-fit:contain}
  .icon-grid-item span{font-size:.75rem;color:#475569;text-align:center;word-break:break-all}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 24px;border-radius:30px;font-size:.9rem;opacity:0;transition:opacity .3;pointer-events:none;z-index:1001}
  .toast.show{opacity:1}
</style></head>
<body>
<div class="header"><h1><span><span class="secret-trigger" id="secretTrigger" onclick="handleSecretClick(event)">LCL H</span>的百宝箱</span></h1></div>
<div class="result-area" id="resultArea"><div class="content-header"><img id="resultIcon" src="" style="display:none"><h2 id="resultTitle">提取结果</h2></div><div id="resultLinks"></div></div>
<div class="main-layout" id="publicView"><div class="tree-panel"><div class="tree-title">公开目录</div><div id="treeContainer"></div></div><div class="content-panel" id="contentPanel"><div style="text-align:center;padding:60px 20px;color:#94a3b8;">请从左侧选择一个节点</div></div></div>
<div class="admin-view" id="adminView"><div class="admin-toolbar"><div style="font-weight:600;">数据管理</div><div class="admin-actions"><button class="btn-small btn-secondary" id="addRootNodeBtn">+ 公开根目录</button><button class="btn-small btn-secondary" id="addCodeBtn">+ 提取码</button><button class="btn-small btn-primary" id="saveBtn">保存</button><button class="btn-small btn-danger" id="exitAdminBtn">退出</button></div></div><div class="icons-editor"><div style="font-size:.85rem;font-weight:600;margin-bottom:8px;">图标链接清单 (一行一个，填绝对 URL)</div><textarea id="iconsListInput" placeholder="https://cdn.jsdelivr.net/gh/user/repo@main/icons/default.ico"></textarea></div><div style="font-weight:600;color:#ef4444;">提取码管理</div><div id="adminCodeList"></div><div style="font-weight:600;color:#3b82f6;">公开目录管理</div><div id="adminTreeList"></div></div>
<div class="modal-mask" id="codeModal">
  <div class="modal">
    <h3>请输入提取码</h3>
    <input type="password" id="codeInput" placeholder="提取码或管理员密码">
    <div class="btn-row">
      <!-- 直接在 HTML 里绑定点击事件，绝对生效 -->
      <button class="btn-secondary" onclick="document.getElementById('codeModal').classList.remove('show')">取消</button>
      <button class="btn-primary" onclick="handleAdminLogin()">确认</button>
    </div>
  </div>
</div><div class="modal-mask" id="iconModal"><div class="modal wide"><h3>选择图标</h3><div class="icon-grid" id="iconGrid"></div><div class="btn-row" style="margin-top:16px;justify-content:flex-end;"><button class="btn-secondary" id="closeIconModal">取消</button></div></div></div>
<div class="toast" id="toast">已复制</div>
<script>
async function handleAdminLogin() {
  const codeInput = document.getElementById('codeInput');
  const codeModal = document.getElementById('codeModal');
  const pwd = codeInput.value.trim();
  
  if (!pwd) { alert('请输入密码'); return; }

  // 先关闭弹窗，给用户反馈
  codeModal.classList.remove('show');
  
  try {
    // 1. 尝试管理员登录
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });
    const data = await res.json();

    if (data.ok) {
      // 登录成功
      isAdmin = true;
      adminPasswordCache = pwd;
      document.body.classList.add('admin-mode');
      await loadAdminData(); // 加载后台数据
      alert('管理员登录成功！');
      return;
    }

    // 2. 尝试验证提取码
    const vRes = await fetch(`${API_BASE}/api/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: pwd })
    });
    const vData = await vRes.json();

    if (vData.ok) {
      // 提取码正确，显示结果
      const resultArea = document.getElementById('resultArea');
      const resultTitle = document.getElementById('resultTitle');
      const resultLinks = document.getElementById('resultLinks');
      
      resultArea.classList.add('show');
      resultTitle.textContent = vData.data.title || '提取结果';
      
      let html = '';
      if (vData.data.links && vData.data.links.length > 0) {
        vData.data.links.forEach(link => {
          html += `<div class="link-row">
            <div class="link-info">
              <div class="link-name">${link.name}</div>
              <div class="link-size">${link.size || ''}</div>
            </div>
            <div class="link-actions">
              <button class="btn-copy" onclick="navigator.clipboard.writeText('${link.magnet}'); alert('已复制')">复制磁力链接</button>
            </div>
          </div>`;
        });
      } else {
        html = '<div style="text-align:center;padding:20px;">暂无内容</div>';
      }
      resultLinks.innerHTML = html;
    } else {
      alert('提取码或密码错误！');
    }
  } catch (err) {
    alert('网络请求失败，请检查 Cloudflare 后端地址！');
    console.error(err);
  }
}
// ⚠️ 注意：把下面的 https://box.huanglcl7.workers.dev 换成你自己的 Worker 网址！
const API_BASE = 'https://box.huanglcl7.workers.dev';

let isAdmin=false, adminPasswordCache="", adminData={tree:[], codes:[]}, availableIcons=[], currentIconTarget=null, currentSelectedId=null;
const expandedIds=new Set();
const $ = id => document.getElementById(id);
const secretTrigger=$("secretTrigger"), resultArea=$("resultArea"), resultTitle=$("resultTitle"), resultIcon=$("resultIcon"), resultLinks=$("resultLinks");
const treeContainer=$("treeContainer"), contentPanel=$("contentPanel"), codeModal=$("codeModal"), codeInput=$("codeInput");
const adminCodeList=$("adminCodeList"), adminTreeList=$("adminTreeList"), iconsListInput=$("iconsListInput"), iconModal=$("iconModal"), iconGrid=$("iconGrid"), toast=$("toast");

function showToast(e){toast.textContent=e; toast.classList.add("show"); clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>toast.classList.remove("show"),2000);}
async function copyText(e){try{if(navigator.clipboard)return await navigator.clipboard.writeText(e),true}catch(e){}try{const t=document.createElement("textarea");t.value=e;t.style.position="fixed";t.style.left="-9999px";document.body.appendChild(t);t.select();const n=document.execCommand("copy");document.body.removeChild(t);return n}catch(e){return false}}
function escapeHtml(e){const t=document.createElement("div");return t.textContent=e,t.innerHTML}
function iconUrl(name){return name||""}

async function loadPublicTree(){try{const e=await fetch(`${API_BASE}/api/tree`),t=await e.json();if(t.ok){adminData.tree=t.tree||[];renderTree();if(adminData.tree.length>0)selectNode(adminData.tree[0].id)}}catch(e){treeContainer.innerHTML='<div style="color:red;padding:10px;">加载失败</div>'}}
function renderTree(){adminData.tree&&adminData.tree.length!==0?(treeContainer.innerHTML=adminData.tree.map(e=>renderTreeNode(e)).join(""),bindTreeEvents()):treeContainer.innerHTML='<div style="text-align:center;padding:20px;color:#94a3b8;">暂无公开内容</div>'}
function renderTreeNode(e){const t=e.children&&e.children.length>0,n=expandedIds.has(e.id),=currentSelectedId===e.id;const o=e.icon?`<img src="${iconUrl(e.icon)}" onerror="this.style.display='none'">`:"";let a=`<div class="tree-node"><div class="tree-node-row ${?"active":""}" data-id="${e.id}" data-has-children="${t}"><span class="arrow ${n?"expanded":""}">${t?"▶":""}</span>${o}<span>${escapeHtml(e.name)}</span></div>`;if(t){a+=`<div class="tree-children ${n?"":"hidden"}">`;a+=e.children.map(e=>renderTreeNode(e)).join("");a+="</div>"}a+="</div>";return a}
function bindTreeEvents(){document.querySelectorAll(".tree-node-row").forEach(e=>{e.addEventListener("click",t=>{const n=e.dataset.id,=e.dataset.hasChildren==="true";if(t.target.classList.contains("arrow")&&){expandedIds.has(n)?expandedIds.delete(n):expandedIds.add(n);renderTree();return}if()expandedIds.add(n);selectNode(n)})})}
async function selectNode(e){currentSelectedId=e;renderTree();resultArea.classList.remove("show");contentPanel.innerHTML='<div style="text-align:center;padding:40px;color:#94a3b8;">加载中...</div>';try{const t=await fetch(`${API_BASE}/api/node?id=${encodeURIComponent(e)}`),n=await t.json();n.ok?renderNodeContent(n.node):contentPanel.innerHTML='<div style="color:red;">加载失败</div>'}catch(e){contentPanel.innerHTML='<div style="color:red;">网络错误</div>'}}
function renderNodeContent(e){const t=e.links||[];const n=e.icon?`<img src="${iconUrl(e.icon)}" onerror="this.style.display='none'">`:"";let =`<div class="content-header">${n}<h2>${escapeHtml(e.name)}</h2></div>`;if(t.length===0)+='<div style="text-align:center;padding:40px;color:#94a3b8;">暂无磁力链接</div>';else{t.forEach(e=>{+=`<div class="link-row"><div class="link-info"><div class="link-name">${escapeHtml(e.name)}</div><div class="link-size">${escapeHtml(e.size||"")}</div></div><div class="link-actions"><button class="btn-copy" data-magnet="${escapeHtml(e.magnet)}">复制磁力链接</button></div><div class="hint">如无反应，请复制链接手动粘贴至 BT 客户端。</div></div>`})}contentPanel.innerHTML=;bindLinkEvents(contentPanel)}
function bindLinkEvents(e){e.querySelectorAll(".btn-copy").forEach(e=>{e.addEventListener("click",async()=>{if(await copyText(e.dataset.magnet)){e.textContent="已复制";showToast("已复制磁力链接");setTimeout(()=>{e.textContent="复制磁力链接"},1800)}})})}
function renderResult(e){resultArea.classList.add("show");resultTitle.textContent=e.title||"提取结果";const t=e.icon?iconUrl(e.icon):"";if(t){resultIcon.src=t;resultIcon.style.display="block"}else{resultIcon.style.display="none"}if(!e.links||e.links.length===0){resultLinks.innerHTML='<div style="text-align:center;padding:20px;color:#64748b;">暂无内容</div>';return}let n="";e.links.forEach(e=>{n+=`<div class="link-row"><div class="link-info"><div class="link-name">${escapeHtml(e.name)}</div><div class="link-size">${escapeHtml(e.size||"")}</div></div><div class="link-actions"><button class="btn-copy" data-magnet="${escapeHtml(e.magnet)}">复制磁力链接</button></div><div class="hint">如无反应，请复制链接手动粘贴至 BT 客户端。</div></div>`});resultLinks.innerHTML=n;bindLinkEvents(resultLinks)}

aync function loadAdminData(){try{cont e=await fetch(`${API_BASE}/api/icons`),t=await e.json();if(t.ok&&Array.isArray(t.icons))availableIcons=t.icons;const n=await fetch(`${API_BASE}/api/admin/get`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:adminPasswordCache})}),=await n.json();if(.ok){adminData=.data;if(!adminData.tree)adminData.tree=[];if(!adminData.codes)adminData.codes=[];if(availableIcons.length>0)iconsListInput.value=availableIcons.join("\n");renderAdmin()}}catch(e){showToast("加载失败")}}

function renderAdmin(){
  adminCodeLit.innerHTML=adminData.codes.map((e,t)=>`<div class="admin-code-card"><div class="admin-code-header"><label>提取码：</label><input type="text" class="code-val" value="${escapeHtml(e.code)}" data-ci="${t}"><label>标题：</label><input type="text" class="title-val" value="${escapeHtml(e.title||"")}" data-ci="${t}"><button class="icon-picker-btn" data-action="pick-icon-code" data-ci="${t}"><img src="${iconUrl(e.icon)}" onerror="this.style.display='none'"><span>换图标</span></button><button class="btn-small btn-danger del-code-btn" data-ci="${t}" style="margin-left:auto;">删除</button></div><div>${(e.links||[]).map((e,n)=>`<div class="admin-link-edit-row" data-ci="${t}" data-li="${n}"><input type="text" class="link-name" value="${escapeHtml(e.name||"")}" placeholder="文件名"><input type="text" class="link-size" value="${escapeHtml(e.size||"")}" placeholder="大小"><input type="text" class="link-magnet" value="${escapeHtml(e.magnet||"")}" placeholder="磁力链接"><button class="btn-icon del-code-link-btn" data-ci="${t}" data-li="${n}">×</button></div>`).join("")}</div><button class="btn-small btn-secondary add-code-link-btn" data-ci="${t}">+ 链接</button></div>`).join("");
  adminTreeLit.innerHTML=adminData.tree.map((e,t)=>renderAdminNode(e,[t])).join("");
  bindAdminEvent();
}

function renderAdminNode(e,t){cont n=t.join("-");const =e.icon?`<img src="${iconUrl(e.icon)}" onerror="this.style.display='none'">`:"";let o=`<div class="admin-code-card" data-path="${n}"><div class="admin-code-header"><label>名称</label><input type="text" class="node-name" value="${escapeHtml(e.name)}" data-path="${n}"><button class="icon-picker-btn" data-action="pick-icon-tree" data-path="${n}">${}<span>换图标</span></button><button class="btn-small btn-secondary" data-action="add-child" data-path="${n}">+ 子节点</button><button class="btn-small btn-danger" data-action="delete-node" data-path="${n}">删除</button></div><div>${(e.links||[]).map((e,t)=>`<div class="admin-link-edit-row" data-path="${n}" data-li="${t}"><input type="text" class="link-name" value="${escapeHtml(e.name||"")}" placeholder="文件名"><input type="text" class="link-size" value="${escapeHtml(e.size||"")}" placeholder="大小"><input type="text" class="link-magnet" value="${escapeHtml(e.magnet||"")}" placeholder="磁力链接"><button class="btn-icon del-tree-link-btn" data-path="${n}" data-li="${t}">×</button></div>`).join("")}</div><button class="btn-small btn-secondary add-tree-link-btn" data-path="${n}">+ 链接</button></div>`;if(e.children&&e.children.length>0)o+=`<div style="margin-left:20px;border-left:1px dashed #cbd5e1;padding-left:10px;">`+e.children.map((e,)=>renderAdminNode(e,[...t,])).join("")+"</div>";return o}

function getNodeByPath(e){if(!e)return null;cont t=e.split("-").map(Number);let n=adminData.tree,=null;for(const e of t){=n[e];if(!)return null;n=.children||[]}return }

function bindAdminEvent(){
  adminCodeLit.querySelectorAll("input").forEach(e=>{e.addEventListener("input",t=>{const n=Number(e.dataset.ci),=e.dataset.li!==undefined?Number(e.dataset.li):null;if(e.classList.contains("code-val"))adminData.codes[n].code=t.target.value;if(e.classList.contains("title-val"))adminData.codes[n].title=t.target.value;if(!==null){if(e.classList.contains("link-name"))adminData.codes[n].links[].name=t.target.value;if(e.classList.contains("link-size"))adminData.codes[n].links[].size=t.target.value;if(e.classList.contains("link-magnet"))adminData.codes[n].links[].magnet=t.target.value}})});
  adminCodeLit.querySelectorAll(".del-code-btn").forEach(e=>{e.addEventListener("click",()=>{const t=Number(e.dataset.ci);if(confirm(`确定删除提取码「${adminData.codes[t].code}」吗？`)){adminData.codes.splice(t,1);renderAdmin()}})});
  adminCodeLit.querySelectorAll(".add-code-link-btn").forEach(e=>{e.addEventListener("click",()=>{const t=Number(e.dataset.ci);if(!adminData.codes[t].links)adminData.codes[t].links=[];adminData.codes[t].links.push({name:"",size:"",magnet:""});renderAdmin()})});
  adminCodeLit.querySelectorAll(".del-code-link-btn").forEach(e=>{e.addEventListener("click",()=>{const t=Number(e.dataset.ci),n=Number(e.dataset.li);adminData.codes[t].links.splice(n,1);renderAdmin()})});
  adminCodeLit.querySelectorAll('button[data-action="pick-icon-code"]').forEach(e=>{e.addEventListener("click",()=>{const t=Number(e.dataset.ci);currentIconTarget={type:"code",ci:t};openIconPicker(adminData.codes[t].icon||"")})});
  adminTreeLit.querySelectorAll(".node-name").forEach(e=>{e.addEventListener("input",t=>{const n=getNodeByPath(e.dataset.path);if(n)n.name=t.target.value})});
  adminTreeLit.querySelectorAll(".admin-link-edit-row").forEach(e=>{const t=e.dataset.path,n=Number(e.dataset.li);e.querySelector(".link-name").addEventListener("input",e=>{const =getNodeByPath(t);if(&&.links[n]).links[n].name=e.target.value});e.querySelector(".link-size").addEventListener("input",e=>{const =getNodeByPath(t);if(&&.links[n]).links[n].size=e.target.value});e.querySelector(".link-magnet").addEventListener("input",e=>{const =getNodeByPath(t);if(&&.links[n]).links[n].magnet=e.target.value})});
  adminTreeLit.querySelectorAll(".del-tree-link-btn").forEach(e=>{e.addEventListener("click",()=>{const t=getNodeByPath(e.dataset.path);if(t){t.links.splice(Number(e.dataset.li),1);renderAdmin()}})});
  adminTreeLit.querySelectorAll(".add-tree-link-btn").forEach(e=>{e.addEventListener("click",()=>{const t=getNodeByPath(e.dataset.path);if(t){if(!t.links)t.links=[];t.links.push({name:"",size:"",magnet:""});renderAdmin()}})});
  adminTreeLit.querySelectorAll('button[data-action="add-child"]').forEach(e=>{e.addEventListener("click",()=>{const t=getNodeByPath(e.dataset.path);if(t){if(!t.children)t.children=[];t.children.push({id:"n-"+Date.now(),name:"新节点",children:[],links:[]});renderAdmin()}})});
  adminTreeLit.querySelectorAll('button[data-action="delete-node"]').forEach(e=>{e.addEventListener("click",()=>{const t=e.dataset.path;if(confirm("确定删除此节点吗？")){const e=t.split("-").map(Number);if(e.length===1)adminData.tree.splice(e[0],1);else{const n=e.slice(0,-1);let =adminData.tree;for(const e of n)=[e].children||[];.splice(e[e.length-1],1)}renderAdmin()}})});
  adminTreeLit.querySelectorAll('button[data-action="pick-icon-tree"]').forEach(e=>{e.addEventListener("click",()=>{currentIconTarget={type:"tree",path:e.dataset.path};const t=getNodeByPath(e.dataset.path);openIconPicker(t.icon||"")})});
}

function openIconPicker(e){
  if(availableIcon.length>0){
    iconGrid.innerHTML=availableIcons.map(t=>`<div class="icon-grid-item ${t===e?"selected":""}" data-icon="${escapeHtml(t)}"><img src="${iconUrl(t)}" onerror="this.style.display='none'"><span>${escapeHtml(t.split("/").pop())}</span></div>`).join("");
    iconGrid.querySelectorAll(".icon-grid-item").forEach(e=>{e.addEventListener("click",()=>{if(currentIconTarget.type==="code")adminData.codes[currentIconTarget.ci].icon=e.dataset.icon;else if(currentIconTarget.type==="tree"){const t=getNodeByPath(currentIconTarget.path);if(t)t.icon=e.dataset.icon}renderAdmin();iconModal.classList.remove("show");showToast("图标已选择")})})
  }ele{
    iconGrid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;">请先在顶部填写图标链接</div>'
  }
  iconModal.claLit.add("how")
}

// 强制绑定点击事件，无视变量冲突
let fastClicks = 0;
document.addEventListener('click', function(e) {
    // 判断点击的是不是包含 "LCL H" 的元素
    if (e.target && e.target.id === 'secretTrigger') {
        fastClicks++;
        if (fastClicks >= 5) {
            fastClicks = 0;
            document.getElementById('codeInput').value = "";
            document.getElementById('codeModal').classList.add('show');
            setTimeout(() => document.getElementById('codeInput').focus(), 100);
        }
        // 如果 3 秒内没有点满 5 下，就重置
        clearTimeout(window.clickTimer);
        window.clickTimer = setTimeout(() => { fastClicks = 0; }, 3000);
    }
});
$("cloeIconModal").addEventLitener("click",()=>iconModal.classList.remove("show"));
$("codeCancel").addEventLitener("click",()=>codeModal.classList.remove("show"));
codeInput.addEventLitener("keydown",e=>{if(e.key==="Enter")$("codeConfirm").click()});
$("codeConfirm").addEventLitener("click",aync()=>{
  cont e=codeInput.value.trim();if(!e)return;
  try{
    cont t=await fetch(`${API_BASE}/api/admin/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:e})}),n=await t.json();
    if(n.ok){adminPawordCache=e;isAdmin=true;codeModal.classList.remove("show");await loadAdminData();document.body.classList.add("admin-mode");resultArea.classList.remove("show");showToast("管理员登录成功");return}
    cont =await fetch(`${API_BASE}/api/verify`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:e})}),o=await .json();
    if(o.ok){codeModal.claLit.remove("how");renderReult(o.data)}ele{howToat("提取码错误")}
  }catch(e){howToat("网络错误")}
});
$("addRootNodeBtn").addEventLitener("click",()=>{adminData.tree.push({id:"n-"+Date.now(),name:"新目录",children:[],links:[]});renderAdmin()});
$("addCodeBtn").addEventLitener("click",()=>{const e=Math.random().toString(36).substring(2,6);adminData.codes.unshift({code:e,title:"新提取码",links:[]});renderAdmin()});
$("aveBtn").addEventLitener("click",aync()=>{const e=$("saveBtn");e.disabled=true;e.textContent="保存中...";const t=iconsListInput.value.split("\n").map(e=>e.trim()).filter(e=>e.length>0);try{const n=await fetch(`${API_BASE}/api/admin/save`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:adminPasswordCache,data:adminData,icons:t})}),=await n.json();if(.ok){availableIcons=t;showToast("保存成功");loadPublicTree()}else{showToast("保存失败："+.error)}}catch(e){showToast("网络错误："+e.message)}finally{e.disabled=false;e.textContent="保存"}});
$("exitAdminBtn").addEventLitener("click",()=>{isAdmin=false;adminPasswordCache="";document.body.classList.remove("admin-mode");resultArea.classList.remove("show");showToast("已退出管理面板");loadPublicTree()});

loadPublicTree();
