<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCL H的百宝箱</title>
  <style>
    /* 全局基础样式 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
    
    /* 顶部标题 */
    .header h1 { font-size: 2rem; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 12px; user-select: none; }
    .secret-trigger { cursor: pointer; }
    
    /* 布局 */
    .layout { width: 100%; max-width: 1000px; display: grid; grid-template-columns: 260px 1fr; gap: 20px; margin-top: 24px; }
    .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; min-height: 400px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
    
    /* 文件列表 */
    .row { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
    .row-info { font-weight: 600; color: #1e293b; }
    .row-size { font-size: 0.85rem; color: #64748b; font-weight: normal; margin-top: 4px; }
    
    /* 按钮通用样式 */
    button { cursor: pointer; border: none; border-radius: 8px; padding: 8px 16px; font-size: 0.9rem; font-weight: 500; transition: all 0.15; font-family: inherit; }
    button:active { transform: scale(0.96); }
    
    /* 彩色按钮 */
    .btn-blue { background: #3b82f6; color: #fff; }
    .btn-blue:hover { background: #2563eb; }
    .btn-gray { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-gray:hover { background: #e2e8f0; }
    .btn-red { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-red:hover { background: #fecaca; }
    
    /* 后台管理面板 */
    .admin-view { display: none; width: 100%; max-width: 1000px; margin-top: 24px; }
    .admin-view.show { display: block; }
    .toolbar { display: flex; justify-content: space-between; background: #fff; padding: 16px 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px; align-items: center; flex-wrap: wrap; gap: 10px; }
    .card { background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
    .card input { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; margin-right: 8px; }
    .card input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }

    /* 弹窗遮罩 */
    .modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-mask.show { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 380px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); text-align: center; }
    .modal h3 { margin-bottom: 20px; font-size: 1.2rem; color: #0f172a; }
    .modal input { width: 100%; padding: 14px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 1rem; outline: none; text-align: center; letter-spacing: 2px; }
    .modal input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .modal-btns { display: flex; gap: 12px; justify-content: center; }
    .modal-btns button { flex: 1; padding: 12px; font-size: 1rem; }

    /* 提取结果区域 */
    .result-area { display: none; width: 100%; max-width: 1000px; margin-top: 24px; }
    .result-area.show { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="secret-trigger" id="secretTrigger">LCL H</span>的百宝箱</h1>
  </div>

  <!-- 提取结果区 -->
  <div class="result-area" id="resultArea">
    <div class="panel">
      <h2 id="resultTitle" style="margin-bottom: 20px; font-size: 1.3rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;"></h2>
      <div id="resultLinks"></div>
    </div>
  </div>

  <!-- 公开目录区 -->
  <div class="layout" id="publicView">
    <div class="panel">
      <div style="font-size: 0.85rem; font-weight: 600; color: #94a3b8; margin-bottom: 16px;">公开目录</div>
      <div id="treeContainer" style="color: #64748b;">加载中...</div>
    </div>
    <div class="panel">
      <div id="contentPanel" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: #94a3b8; min-height: 300px;">
        请从左侧选择一个目录
      </div>
    </div>
  </div>

  <!-- 后台管理区 -->
  <div class="admin-view" id="adminView">
    <div class="toolbar">
      <div style="font-weight: 600; color: #ef4444;">管理员控制台</div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn-gray" onclick="addRootNode()">+ 公开根目录</button>
        <button class="btn-gray" onclick="addCode()">+ 提取码</button>
        <button class="btn-blue" onclick="saveData()">保存全部</button>
        <button class="btn-red" onclick="exitAdmin()">退出</button>
      </div>
    </div>
    <div id="adminTreeList"></div>
    <div id="adminCodeList"></div>
  </div>

  <!-- 密码弹窗 -->
  <div class="modal-mask" id="codeModal">
    <div class="modal">
      <h3>请输入提取码</h3>
      <input type="password" id="codeInput" placeholder="请输入提取码">
      <div class="modal-btns">
        <button class="btn-gray" onclick="document.getElementById('codeModal').classList.remove('show')">取消</button>
        <button class="btn-blue" onclick="handleConfirm()">确认</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 替换为你的 Cloudflare Worker 地址（末尾别加斜杠）
    const API_BASE = 'https://box.huanglcl7.workers.dev'; 
    
    let isAdmin = false;
    let pwdCache = "";
    let data = { tree: [], codes: [] };

    // ===== 1. 连点 5 下逻辑 =====
    let clicks = 0, timer = null;
    document.getElementById('secretTrigger').onclick = function() {
      clicks++;
      clearTimeout(timer);
      timer = setTimeout(function() { clicks = 0; }, 2000);
      if (clicks >= 5) {
        clicks = 0;
        document.getElementById('codeInput').value = "";
        document.getElementById('codeModal').classList.add('show');
      }
    };

    // ===== 2. 验证与登录 =====
    async function handleConfirm() {
      let val = document.getElementById('codeInput').value.trim();
      if (!val) return alert("请输入内容");
      document.getElementById('codeModal').classList.remove('show');

      try {
        // 尝试管理员登录
        let res = await fetch(API_BASE + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: val })
        });
        let json = await res.json();
        
        if (json.ok) {
          pwdCache = val;
          isAdmin = true;
          document.getElementById('publicView').style.display = 'none';
          document.getElementById('adminView').classList.add('show');
          alert("管理员登录成功");
          loadAdminData();
          return;
        }

        // 尝试提取码验证
        let vRes = await fetch(API_BASE + '/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: val })
        });
        let vJson = await vRes.json();

        if (vJson.ok) {
          document.getElementById('resultArea').classList.add('show');
          document.getElementById('resultTitle').innerText = vJson.data.title || "提取结果";
          
          let html = "";
          if (vJson.data.links && vJson.data.links.length > 0) {
            vJson.data.links.forEach(function(l) {
              html += `
                <div class="row">
                  <div>
                    <div class="row-info">${l.name}</div>
                    <div class="row-size">${l.size || ''}</div>
                  </div>
                  <button class="btn-blue" onclick="navigator.clipboard.writeText('${l.magnet}'); alert('已复制磁力链接')">复制磁力链接</button>
                </div>`;
            });
          } else {
            html = '<div style="text-align:center; color:#94a3b8; padding: 20px;">暂无内容</div>';
          }
          document.getElementById('resultLinks').innerHTML = html;
        } else {
          alert("提取码错误");
        }
      } catch (e) {
        alert("网络错误: " + e.message);
      }
    }

    // ===== 3. 加载公开目录 =====
    async function loadTree() {
      try {
        let res = await fetch(API_BASE + '/api/tree');
        let json = await res.json();
        if (json.ok) {
          data.tree = json.tree;
          if (data.tree.length === 0) {
            document.getElementById('treeContainer').innerHTML = '<div style="text-align:center;">暂无内容</div>';
            return;
          }
          document.getElementById('treeContainer').innerHTML = data.tree.map(function(n) {
            return `<div style="cursor:pointer; padding:10px; border-radius:8px; transition:background 0.2s;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='transparent'" onclick="loadNode('${n.id}')">📁 ${n.name}</div>`;
          }).join('');
        }
      } catch (e) {
        document.getElementById('treeContainer').innerHTML = '<div style="color:red; text-align:center;">加载失败</div>';
      }
    }

    async function loadNode(id) {
      document.getElementById('contentPanel').innerHTML = '<div>加载中...</div>';
      try {
        let res = await fetch(API_BASE + '/api/node?id=' + id);
        let json = await res.json();
        if (json.ok && json.node) {
          let links = json.node.links || [];
          let html = `<h2 style="margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;">${json.node.name}</h2>`;
          
          if (links.length === 0) {
            html += '<div style="text-align:center; padding: 40px; color: #94a3b8;">该目录下暂无文件</div>';
          } else {
            links.forEach(function(l) {
              html += `
                <div class="row">
                  <div>
                    <div class="row-info">${l.name}</div>
                    <div class="row-size">${l.size || ''}</div>
                  </div>
                  <button class="btn-blue" onclick="navigator.clipboard.writeText('${l.magnet}'); alert('已复制磁力链接')">复制磁力链接</button>
                </div>`;
            });
          }
          document.getElementById('contentPanel').innerHTML = html;
          document.getElementById('contentPanel').style.display = 'block';
        }
      } catch (e) {
        document.getElementById('contentPanel').innerHTML = '<div style="color:red;">加载失败</div>';
      }
    }

    // ===== 4. 后台管理加载 =====
    async function loadAdminData() {
      try {
        let res = await fetch(API_BASE + '/api/admin/get', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwdCache })
        });
        let json = await res.json();
        if (json.ok) {
          data = json.data;
          renderAdmin();
        }
      } catch (e) {
        alert("加载后台失败: " + e.message);
      }
    }

    // ===== 5. 渲染后台界面 =====
    function renderAdmin() {
      // 渲染目录
      document.getElementById('adminTreeList').innerHTML = `
        <div style="font-size: 1.1rem; font-weight: 600; color: #3b82f6; margin: 20px 0 12px;">公开目录管理</div>
        ` + data.tree.map(function(n, i) {
        return `<div class="card">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div>名称: <input style="width: 200px;" value="${n.name}" oninput="data.tree[${i}].name=this.value"></div>
            <button class="btn-red" onclick="data.tree.splice(${i},1); renderAdmin();">删除</button>
          </div>
        </div>`;
      }).join('');

      // 渲染提取码
      document.getElementById('adminCodeList').innerHTML = `
        <div style="font-size: 1.1rem; font-weight: 600; color: #ef4444; margin: 20px 0 12px;">提取码管理</div>
        ` + data.codes.map(function(c, i) {
        return `<div class="card">
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap: 10px;">
            <div>
              提取码: <input style="width: 120px; color: #ef4444; font-weight: bold;" value="${c.code}" oninput="data.codes[${i}].code=this.value">
              标题: <input style="width: 200px;" value="${c.title || ''}" oninput="data.codes[${i}].title=this.value">
            </div>
            <button class="btn-red" onclick="data.codes.splice(${i},1); renderAdmin();">删除</button>
          </div>
        </div>`;
      }).join('');
    }

    // ===== 6. 操作按钮 =====
    function addCode() {
      data.codes.unshift({ code: "新提取码", title: "新标题", links: [] });
      renderAdmin();
    }
    function addRootNode() {
      data.tree.push({ id: "id-" + Date.now(), name: "新目录", children: [], links: [] });
      renderAdmin();
    }
    async function saveData() {
      try {
        let res = await fetch(API_BASE + '/api/admin/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwdCache, data: data })
        });
        let json = await res.json();
        if (json.ok) {
          alert("保存成功！");
          loadTree(); // 刷新主页
        } else {
          alert("保存失败");
        }
      } catch (e) {
        alert("保存出错: " + e.message);
      }
    }
    function exitAdmin() {
      isAdmin = false; pwdCache = "";
      document.getElementById('adminView').classList.remove('show');
      document.getElementById('publicView').style.display = 'grid';
      document.getElementById('resultArea').classList.remove('show');
      loadTree();
    }

    // 初始化加载
    loadTree();
  </script>
</body>
</html>
