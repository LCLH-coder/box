<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>LCL H的百宝箱</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 30px; color: #333; }
    .header h1 { font-size: 24px; }
    .secret-trigger { cursor: pointer; color: #000; }
    .layout { display: flex; gap: 20px; margin-top: 20px; }
    .tree { width: 200px; background: #fff; padding: 15px; border-radius: 8px; }
    .content { flex: 1; background: #fff; padding: 15px; border-radius: 8px; }
    .row { display: flex; justify-content: space-between; padding: 10px; background: #f1f5f9; margin-bottom: 10px; border-radius: 6px; }
    button { cursor: pointer; padding: 6px 12px; border-radius: 6px; border: none; background: #3b82f6; color: #fff; }
    .admin-view { display: none; margin-top: 20px; }
    .admin-view.show { display: block; }
    .card { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; }
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; }
    .modal.show { display: flex; }
    .modal-box { background: #fff; padding: 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="secret-trigger" id="secretTrigger">LCL H</span>的百宝箱</h1>
  </div>

  <div id="resultArea" style="display: none; background: #fff; padding: 15px; margin-top: 20px; border-radius: 8px;">
    <h3 id="resultTitle"></h3>
    <div id="resultLinks"></div>
  </div>

  <div class="layout" id="publicView">
    <div class="tree" id="treeContainer">加载中...</div>
    <div class="content" id="contentPanel">请选择目录</div>
  </div>

  <div class="admin-view" id="adminView">
    <button onclick="document.getElementById('adminView').classList.remove('show'); document.getElementById('publicView').style.display='flex';">退出管理</button>
    <button onclick="addCode()">+ 提取码</button>
    <button onclick="addRootNode()">+ 根目录</button>
    <button onclick="saveData()" style="background: #10b981;">保存全部</button>
    <div id="adminTreeList" style="margin-top: 20px;"></div>
    <div id="adminCodeList"></div>
  </div>

  <div class="modal" id="codeModal">
    <div class="modal-box">
      <h3>请输入提取码</h3>
      <input type="password" id="codeInput" placeholder="请输入提取码" style="padding: 8px; width: 100%; margin-bottom: 15px;">
      <div style="display: flex; gap: 10px;">
        <button onclick="document.getElementById('codeModal').classList.remove('show')" style="background: #ccc; color: #000;">取消</button>
        <button onclick="handleConfirm()">确认</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://box.huanglcl7.workers.dev'; // 改成你的地址
    let isAdmin = false;
    let pwdCache = "";
    let data = { tree: [], codes: [] };

    // 1. 连点5下
    let clicks = 0, timer = null;
    document.getElementById('secretTrigger').onclick = function() {
      clicks++;
      clearTimeout(timer);
      timer = setTimeout(function() { clicks = 0; }, 2000);
      if (clicks >= 5) {
        clicks = 0;
        document.getElementById('codeInput').value = "";
        document.getElementById('codeModal').classList.add('show');
      }
    };

    // 2. 确认验证
    async function handleConfirm() {
      let val = document.getElementById('codeInput').value.trim();
      if (!val) return alert("请输入内容");
      document.getElementById('codeModal').classList.remove('show');

      try {
        // 尝试管理员登录
        let res = await fetch(API_BASE + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: val })
        });
        let json = await res.json();
        
        if (json.ok) {
          pwdCache = val;
          isAdmin = true;
          document.getElementById('publicView').style.display = 'none';
          document.getElementById('adminView').classList.add('show');
          alert("管理员登录成功");
          loadAdminData();
          return;
        }

        // 尝试提取码
        let vRes = await fetch(API_BASE + '/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: val })
        });
        let vJson = await vRes.json();

        if (vJson.ok) {
          document.getElementById('resultArea').style.display = 'block';
          document.getElementById('resultTitle').innerText = vJson.data.title || "提取结果";
          let html = "";
          if (vJson.data.links) {
            vJson.data.links.forEach(function(l) {
              html += `<div class="row"><div>${l.name} (${l.size})</div><button onclick="navigator.clipboard.writeText('${l.magnet}'); alert('已复制')">复制磁力</button></div>`;
            });
          }
          document.getElementById('resultLinks').innerHTML = html;
        } else {
          alert("提取码错误");
        }
      } catch (e) {
        alert("网络错误: " + e.message);
      }
    }

    // 3. 加载公开目录
    async function loadTree() {
      let res = await fetch(API_BASE + '/api/tree');
      let json = await res.json();
      if (json.ok) {
        data.tree = json.tree;
        document.getElementById('treeContainer').innerHTML = data.tree.map(function(n) {
          return `<div style="cursor:pointer; padding:5px;" onclick="alert('点开了: ${n.name}')">📁 ${n.name}</div>`;
        }).join('');
      }
    }

    // 4. 加载后台数据
    async function loadAdminData() {
      let res = await fetch(API_BASE + '/api/admin/get', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwdCache })
      });
      let json = await res.json();
      if (json.ok) {
        data = json.data;
        renderAdmin();
      }
    }

    // 5. 渲染后台
    function renderAdmin() {
      // 渲染提取码
      document.getElementById('adminCodeList').innerHTML = data.codes.map(function(c, i) {
        return `<div class="card">提取码: <input value="${c.code}" oninput="data.codes[${i}].code=this.value"> 标题: <input value="${c.title}" oninput="data.codes[${i}].title=this.value"> <button onclick="data.codes.splice(${i},1); renderAdmin();" style="background:red">删除</button></div>`;
      }).join('');

      // 渲染目录树
      document.getElementById('adminTreeList').innerHTML = data.tree.map(function(n, i) {
        return `<div class="card">名称: <input value="${n.name}" oninput="data.tree[${i}].name=this.value"> <button onclick="data.tree.splice(${i},1); renderAdmin();" style="background:red">删除</button></div>`;
      }).join('');
    }

    // 6. 辅助按钮
    function addCode() {
      data.codes.unshift({ code: "新码", title: "新标题", links: [] });
      renderAdmin();
    }
    function addRootNode() {
      data.tree.push({ id: "id-" + Date.now(), name: "新目录", children: [], links: [] });
      renderAdmin();
    }
    async function saveData() {
      let res = await fetch(API_BASE + '/api/admin/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwdCache, data: data })
      });
      let json = await res.json();
      if (json.ok) alert("保存成功！");
      else alert("保存失败");
    }

    // 初始化
    loadTree();
  </script>
</body>
</html>
