<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCL H的百宝箱</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
    .header { width: 100%; max-width: 1000px; margin-bottom: 24px; display: flex; align-items: center; }
    .header h1 { font-size: 2rem; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 12px; user-select: none; }
    .secret-trigger { cursor: pointer; }
    .main-layout { width: 100%; max-width: 1000px; display: grid; grid-template-columns: 260px 1fr; gap: 20px; min-height: 500px; }
    .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; overflow-y: auto; max-height: 75vh; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
    .tree-title { font-size: 0.85rem; font-weight: 600; color: #94a3b8; margin-bottom: 16px; }
    .tree-node-row { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; color: #334155; transition: all 0.15s; }
    .tree-node-row:hover { background: #f1f5f9; }
    .tree-node-row.active { background: #e0f2fe; color: #0284c7; font-weight: 500; }
    .tree-node-row .arrow { width: 16px; font-size: 0.7rem; color: #94a3b8; text-align: center; transition: transform 0.2s; }
    .tree-node-row .arrow.expanded { transform: rotate(90deg); }
    .tree-node-row img { width: 18px; height: 18px; object-fit: contain; }
    .tree-children { margin-left: 16px; border-left: 1px dashed #cbd5e1; padding-left: 8px; }
    .tree-children.hidden { display: none; }
    .content-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #f1f5f9; }
    .content-header img { width: 32px; height: 32px; object-fit: contain; }
    .content-header h2 { font-size: 1.3rem; color: #0f172a; }
    .link-row { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-radius: 12px; background: #f8fafc; margin-bottom: 10px; border: 1px solid #e2e8f0; gap: 12px; flex-wrap: wrap; }
    .link-info { flex: 1; min-width: 200px; }
    .link-name { font-weight: 600; font-size: 1rem; color: #1e293b; margin-bottom: 4px; }
    .link-size { font-size: 0.85rem; color: #64748b; }
    button { cursor: pointer; border: none; border-radius: 8px; padding: 8px 16px; font-size: 0.85rem; font-weight: 500; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; font-family: inherit; }
    button:active { transform: scale(0.96); }
    .btn-copy { background: #eff6ff; color: #2563eb; }
    .btn-copy:hover { background: #dbeafe; }
    .btn-blue { background: #3b82f6; color: #fff; }
    .btn-blue:hover { background: #2563eb; }
    .btn-gray { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-gray:hover { background: #e2e8f0; }
    .btn-red { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-red:hover { background: #fecaca; }
    .result-area { display: none; width: 100%; max-width: 1000px; margin-top: 24px; }
    .result-area.show { display: block; }
    .admin-view { display: none; width: 100%; max-width: 1000px; margin-top: 24px; }
    .admin-view.show { display: block; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 16px 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .card { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 20px; margin-bottom: 16px; }
    .card-header { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px dashed #e2e8f0; flex-wrap: wrap; }
    .card-header input { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .card-header input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-mask.show { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .modal h3 { margin-bottom: 20px; font-size: 1.2rem; color: #0f172a; }
    .modal input { width: 100%; padding: 12px 16px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; outline: none; text-align: left; letter-spacing: 1px; }
    .modal input::placeholder { text-align: left; }
    .modal input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .modal-btns { display: flex; gap: 10px; justify-content: center; }
    .modal-btns button { flex: 1; padding: 12px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="secret-trigger" id="secretTrigger">LCL H</span>的百宝箱</h1>
  </div>

  <div class="result-area" id="resultArea">
    <div class="panel" style="max-height:none;">
      <h2 id="resultTitle" style="margin-bottom: 20px; font-size: 1.3rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;"></h2>
      <div id="resultLinks"></div>
    </div>
  </div>

  <div class="main-layout" id="publicView">
    <div class="panel">
      <div class="tree-title">公开目录</div>
      <div id="treeContainer">加载中...</div>
    </div>
    <div class="panel">
      <div id="contentPanel" style="display: flex; justify-content: center; align-items: center; height: 100%; color: #94a3b8;">
        请从左侧选择目录
      </div>
    </div>
  </div>

  <div class="admin-view" id="adminView">
    <div class="toolbar">
      <div style="font-weight: 600; color: #ef4444;">管理员控制台</div>
      <div style="display: flex; gap: 10px;">
        <button class="btn-gray" onclick="addRootNode()">+ 公开根目录</button>
        <button class="btn-gray" onclick="addCode()">+ 提取码</button>
        <button class="btn-blue" onclick="saveData()">保存全部</button>
        <button class="btn-red" onclick="exitAdmin()">退出管理</button>
      </div>
    </div>
    
    <div class="card">
      <div style="font-size: 0.95rem; font-weight: 600; margin-bottom: 12px; color: #334155;">图标链接清单 (一行一个绝对 URL)</div>
      <textarea id="iconsListInput" style="width: 100%; min-height: 90px; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: monospace; font-size: 0.85rem; outline: none; resize: vertical;" placeholder="https://cdn.jsdelivr.net/gh/user/repo@main/icons/default.ico"></textarea>
    </div>

    <div id="adminTreeList"></div>
    <div id="adminCodeList"></div>
  </div>

  <div class="modal-mask" id="codeModal">
    <div class="modal">
      <h3>请输入提取码</h3>
      <input type="password" id="codeInput" placeholder="请输入提取码">
      <div class="modal-btns">
        <button class="btn-gray" onclick="document.getElementById('codeModal').classList.remove('show')">取消</button>
        <button class="btn-blue" onclick="handleConfirm()">确认</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://box.huanglcl7.workers.dev'; 
    
    var isAdmin = false;
    var pwdCache = "";
    var data = { tree: [], codes: [] };
    var currentSelectedId = null;
    var expandedIds = [];

    // 连点 5 下
    var clicks = 0, timer = null;
    document.getElementById('secretTrigger').onclick = function() {
      clicks++;
      clearTimeout(timer);
      timer = setTimeout(function() { clicks = 0; }, 2000);
      if (clicks >= 5) {
        clicks = 0;
        document.getElementById('codeInput').value = "";
        document.getElementById('codeModal').classList.add('show');
        setTimeout(function() { document.getElementById('codeInput').focus(); }, 100);
      }
    };

    // 验证与提取
    async function handleConfirm() {
      var val = document.getElementById('codeInput').value.trim();
      if (!val) return alert("请输入内容");
      document.getElementById('codeModal').classList.remove('show');

      try {
        var res = await fetch(API_BASE + '/api/admin/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: val })
        });
        var json = await res.json();
        if (json.ok) {
          pwdCache = val; 
          isAdmin = true;
          document.getElementById('publicView').style.display = 'none';
          document.getElementById('adminView').classList.add('show');
          alert("管理员登录成功");
          loadAdminData();
          return;
        }

        var vRes = await fetch(API_BASE + '/api/verify', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: val })
        });
        var vJson = await vRes.json();

        if (vJson.ok) {
          document.getElementById('resultArea').classList.add('show');
          document.getElementById('resultTitle').innerText = vJson.data.title || "提取结果";
          var html = "";
          if (vJson.data.links && vJson.data.links.length > 0) {
            vJson.data.links.forEach(function(l) {
              html += '<div class="link-row"><div class="link-info"><div class="link-name">' + l.name + '</div><div class="link-size">' + (l.size || '') + '</div></div><button class="btn-copy" onclick="navigator.clipboard.writeText(\'' + l.magnet + '\'); alert(\'已复制\')">复制磁力链接</button></div>';
            });
          } else {
            html = '<div style="text-align:center; padding: 20px; color:#94a3b8;">暂无内容</div>';
          }
          document.getElementById('resultLinks').innerHTML = html;
        } else {
          alert("提取码错误");
        }
      } catch (e) {
        alert("网络错误: " + e.message);
      }
    }

    // 加载目录树
    async function loadTree() {
      try {
        var res = await fetch(API_BASE + '/api/tree');
        var json = await res.json();
        if (json.ok) {
          data.tree = json.tree;
          renderTree();
          if (data.tree.length > 0 && !currentSelectedId) loadNode(data.tree[0].id);
        }
      } catch (e) {
        document.getElementById('treeContainer').innerHTML = '<div style="color:red;">加载失败</div>';
      }
    }

    function renderTree() {
      if (!data.tree || data.tree.length === 0) {
        document.getElementById('treeContainer').innerHTML = '<div style="text-align:center;">暂无目录</div>';
        return;
      }
      var html = "";
      for (var i = 0; i < data.tree.length; i++) {
        html += renderTreeNode(data.tree[i]);
      }
      document.getElementById('treeContainer').innerHTML = html;
      bindTreeEvents();
    }

    function renderTreeNode(node) {
      var hasChildren = node.children && node.children.length > 0;
      var isExpanded = expandedIds.indexOf(node.id) > -1;
      var isActive = currentSelectedId === node.id;
      var icon = node.icon ? '<img src="' + node.icon + '">' : "";
      var html = '<div><div class="tree-node-row ' + (isActive?'active':'') + '" data-id="' + node.id + '" data-has-children="' + hasChildren + '"><span class="arrow ' + (isExpanded?'expanded':'') + '">' + (hasChildren?'▶':'') + '</span>' + icon + '<span>' + node.name + '</span></div>';
      if (hasChildren) {
        var childHtml = "";
        for (var i = 0; i < node.children.length; i++) {
          childHtml += renderTreeNode(node.children[i]);
        }
        html += '<div class="tree-children ' + (isExpanded?'':'hidden') + '">' + childHtml + '</div>';
      }
      return html + '</div>';
    }

    function bindTreeEvents() {
      var rows = document.querySelectorAll('.tree-node-row');
      for (var i = 0; i < rows.length; i++) {
        rows[i].onclick = function(e) {
          var id = this.dataset.id;
          var hasChildren = this.dataset.hasChildren === 'true';
          if (e.target.classList.contains('arrow') && hasChildren) {
            var idx = expandedIds.indexOf(id);
            if (idx > -1) expandedIds.splice(idx, 1); else expandedIds.push(id);
            renderTree(); return;
          }
          if (hasChildren && expandedIds.indexOf(id) === -1) expandedIds.push(id);
          loadNode(id);
        };
      }
    }

    async function loadNode(id) {
      currentSelectedId = id;
      renderTree();
      document.getElementById('resultArea').classList.remove('show');
      document.getElementById('contentPanel').innerHTML = '<div style="text-align:center;">加载中...</div>';
      try {
        var res = await fetch(API_BASE + '/api/node?id=' + id);
        var json = await res.json();
        if (json.ok && json.node) {
          renderNodeContent(json.node);
        } else {
          document.getElementById('contentPanel').innerHTML = '<div style="color:red;">加载失败</div>';
        }
      } catch (e) {
        document.getElementById('contentPanel').innerHTML = '<div style="color:red;">网络错误</div>';
      }
    }

    function renderNodeContent(node) {
      var links = node.links || [];
      var icon = node.icon ? '<img src="' + node.icon + '">' : "";
      var html = '<div class="content-header">' + icon + '<h2>' + node.name + '</h2></div>';
      if (links.length === 0) {
        html += '<div style="text-align:center; padding: 40px; color:#94a3b8;">暂无文件</div>';
      } else {
        for (var i = 0; i < links.length; i++) {
          var l = links[i];
          html += '<div class="link-row"><div class="link-info"><div class="link-name">' + l.name + '</div><div class="link-size">' + (l.size || '') + '</div></div><button class="btn-copy" onclick="navigator.clipboard.writeText(\'' + l.magnet + '\'); alert(\'已复制\')">复制磁力链接</button></div>';
        }
      }
      document.getElementById('contentPanel').innerHTML = html;
      document.getElementById('contentPanel').style.display = 'block';
    }

    // 后台管理
    async function loadAdminData() {
      try {
        var res = await fetch(API_BASE + '/api/admin/get', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwdCache })
        });
        var json = await res.json();
        if (json.ok) { 
          data = json.data; 
          if (data.icons && data.icons.length > 0) {
            document.getElementById('iconsListInput').value = data.icons.join('\n');
          }
          renderAdmin(); 
        }
      } catch (e) { alert("加载失败"); }
    }

    function renderAdmin() {
      var treeHtml = '<div style="font-size:1.1rem;font-weight:600;color:#3b82f6;margin:20px 0 12px;">公开目录管理</div>';
      for (var i = 0; i < data.tree.length; i++) {
        var n = data.tree[i];
        treeHtml += '<div class="card"><div class="card-header"><label>名称:</label><input style="width:200px;" value="' + n.name + '" oninput="data.tree[' + i + '].name=this.value"><button class="btn-red" onclick="data.tree.splice(' + i + ',1); renderAdmin();">删除</button></div></div>';
      }
      document.getElementById('adminTreeList').innerHTML = treeHtml;

      var codeHtml = '<div style="font-size:1.1rem;font-weight:600;color:#ef4444;margin:20px 0 12px;">提取码管理</div>';
      for (var j = 0; j < data.codes.length; j++) {
        var c = data.codes[j];
        codeHtml += '<div class="card"><div class="card-header"><label>提取码:</label><input style="width:100px;font-weight:bold;color:#ef4444;" value="' + c.code + '" oninput="data.codes[' + j + '].code=this.value"><label>标题:</label><input style="width:200px;" value="' + (c.title || '') + '" oninput="data.codes[' + j + '].title=this.value"><button class="btn-red" style="margin-left:auto;" onclick="data.codes.splice(' + j + ',1); renderAdmin();">删除</button></div></div>';
      }
      document.getElementById('adminCodeList').innerHTML = codeHtml;
    }

    function addRootNode() {
      data.tree.push({ id: "id-" + Date.now(), name: "新目录", children: [], links: [] });
      renderAdmin();
    }
    
    function addCode() {
      data.codes.unshift({ code: "新码", title: "新标题", links: [] });
      renderAdmin();
    }

    async function saveData() {
      try {
        var text = document.getElementById('iconsListInput').value;
        var lines = text.split('\n');
        var iconList = [];
        for (var i = 0; i < lines.length; i++) {
          if (lines[i].trim()) iconList.push(lines[i].trim());
        }
        
        var res = await fetch(API_BASE + '/api/admin/save', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwdCache, data: data, icons: iconList })
        });
        var json = await res.json();
        if (json.ok) { alert("保存成功！"); loadTree(); } else { alert("保存失败"); }
      } catch (e) { alert("保存出错"); }
    }

    function exitAdmin() {
      isAdmin = false; pwdCache = "";
      document.getElementById('adminView').classList.remove('show');
      document.getElementById('publicView').style.display = 'grid';
      document.getElementById('resultArea').classList.remove('show');
      loadTree();
    }

    loadTree();
  </script>
</body>
</html>
