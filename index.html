<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LCL H的百宝箱</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 20px}
  .header{width:100%;max-width:1000px;margin-bottom:24px;display:flex;align-items:center}
  .header h1{font-size:2rem;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:12px;user-select:none}
  .secret-trigger{cursor:pointer}
  .main-layout{width:100%;max-width:1000px;display:grid;grid-template-columns:260px 1fr;gap:20px;min-height:500px}
  .tree-panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;overflow-y:auto;max-height:75vh}
  .tree-title{font-size:.8rem;font-weight:600;color:#94a3b8;margin-bottom:12px;padding-left:8px}
  .tree-node-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-size:.95rem;color:#334155;transition:background .15}
  .tree-node-row:hover{background:#f1f5f9}
  .tree-node-row.active{background:#e0f2fe;color:#0284c7;font-weight:500}
  .tree-node-row .arrow{width:16px;font-size:.7rem;color:#94a3b8;text-align:center;transition:transform .2}
  .tree-node-row .arrow.expanded{transform:rotate(90deg)}
  .tree-node-row img{width:18px;height:18px;object-fit:contain}
  .tree-children{margin-left:16px;border-left:1px dashed #cbd5e1;padding-left:8px}
  .tree-children.hidden{display:none}
  .content-panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;overflow-y:auto;max-height:75vh}
  .content-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f1f5f9}
  .content-header img{width:32px;height:32px;object-fit:contain}
  .content-header h2{font-size:1.3rem;color:#0f172a}
  .link-row{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:12px;background:#f8fafc;margin-bottom:10px;border:1px solid #e2e8f0;gap:12px;flex-wrap:wrap}
  .link-info{flex:1;min-width:200px}
  .link-name{font-weight:600;font-size:1rem;color:#1e293b;margin-bottom:4px}
  .link-size{font-size:.85rem;color:#64748b}
  .link-actions{display:flex;gap:8px}
  .link-actions button{padding:8px 16px;border-radius:8px;font-size:.85rem;cursor:pointer;border:none;transition:all .15}
  .btn-copy{background:#eff6ff;color:#2563eb;font-weight:500}
  .btn-copy:hover{background:#dbeafe}
  .hint{font-size:.75rem;color:#94a3b8;margin-top:8px;width:100%}
  .result-area{display:none;width:100%;max-width:1000px;background:#fff;border-radius:16px;padding:24px;border:1px solid #e2e8f0;margin-bottom:24px}
  .result-area.show{display:block}
  .admin-view{display:none;width:100%;max-width:1000px;flex-direction:column;gap:20px}
  body.admin-mode .main-layout{display:none}
  body.admin-mode .result-area{display:none!important}
  body.admin-mode .admin-view{display:flex}
  body.admin-mode .header h1::after{content:' (管理面板)';font-size:1.1rem;color:#ef4444}
  .admin-toolbar{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:16px 20px;border-radius:12px;border:1px solid #e2e8f0}
  .admin-actions{display:flex;gap:10px}
  .admin-code-card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:20px}
  .admin-code-header{display:flex;gap:12px;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px dashed #e2e8f0;flex-wrap:wrap}
  .admin-code-header input[type=text]{padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;outline:none}
  .admin-code-header .code-input{font-weight:600;color:#ef4444;width:120px}
  .admin-code-header .title-input{flex:1;font-weight:500;color:#0f172a;min-width:150px}
  .icon-picker-btn{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc;cursor:pointer;font-size:.85rem}
  .icon-picker-btn img{width:20px;height:20px;object-fit:contain}
  .admin-link-edit-row{display:grid;grid-template-columns:1fr 80px 2fr 36px;gap:8px;margin-bottom:8px}
  .admin-link-edit-row input{padding:8px;border:1px solid #cbd5e1;border-radius:6px;font-size:.85rem;outline:none}
  .btn-small{padding:6px 12px;border-radius:6px;font-size:.85rem;cursor:pointer;border:1px solid transparent}
  .btn-primary{background:#3b82f6;color:#fff}
  .btn-secondary{background:#f1f5f9;color:#334155;border-color:#cbd5e1}
  .btn-danger{background:#fee2e2;color:#dc2626;border-color:#fecaca}
  .btn-icon{background:#fee2e2;color:#dc2626;border:none;border-radius:6px;cursor:pointer;font-size:1.1rem}
  .icons-editor{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:16px}
  .icons-editor textarea{width:100%;min-height:80px;padding:10px;border-radius:8px;border:1px solid #cbd5e1;font-family:monospace;font-size:.85rem;outline:none;resize:vertical}
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:center;z-index:1000}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:400px;text-align:center}
  .modal h3{margin-bottom:20px;font-size:1.1rem}
  .modal input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:16px;outline:none}
  .modal .btn-row{display:flex;justify-content:center;gap:10px}
  .modal .btn-row button{padding:10px 24px;border-radius:8px;border:none;font-size:.95rem;cursor:pointer}
  .modal.wide{max-width:600px;text-align:left}
  .icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:12px;max-height:400px;overflow-y:auto;padding:4px}
  .icon-grid-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border-radius:10px;border:2px solid #e2e8f0;cursor:pointer;transition:all .2}
  .icon-grid-item:hover{border-color:#93c5fd;background:#eff6ff}
  .icon-grid-item.selected{border-color:#3b82f6;background:#dbeafe}
  .icon-grid-item img{width:40px;height:40px;object-fit:contain}
  .icon-grid-item span{font-size:.75rem;color:#475569;text-align:center;word-break:break-all}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 24px;border-radius:30px;font-size:.9rem;opacity:0;transition:opacity .3;pointer-events:none;z-index:1001}
  .toast.show{opacity:1}
</style></head>
<body>
<div class="header"><h1><span><span class="secret-trigger" id="secretTrigger">LCL H</span>的百宝箱</span></h1></div>
<div class="result-area" id="resultArea"><div class="content-header"><img id="resultIcon" src="" style="display:none"><h2 id="resultTitle">提取结果</h2></div><div id="resultLinks"></div></div>
<div class="main-layout" id="publicView"><div class="tree-panel"><div class="tree-title">公开目录</div><div id="treeContainer"></div></div><div class="content-panel" id="contentPanel"><div style="text-align:center;padding:60px 20px;color:#94a3b8;">请从左侧选择一个节点</div></div></div>
<div class="admin-view" id="adminView"><div class="admin-toolbar"><div style="font-weight:600;">数据管理</div><div class="admin-actions"><button class="btn-small btn-secondary" id="addRootNodeBtn">+ 公开根目录</button><button class="btn-small btn-secondary" id="addCodeBtn">+ 提取码</button><button class="btn-small btn-primary" id="saveBtn">保存</button><button class="btn-small btn-danger" id="exitAdminBtn">退出</button></div></div><div class="icons-editor"><div style="font-size:.85rem;font-weight:600;margin-bottom:8px;">图标链接清单 (一行一个，填绝对 URL)</div><textarea id="iconsListInput" placeholder="https://cdn.jsdelivr.net/gh/user/repo@main/icons/default.ico"></textarea></div><div style="font-weight:600;color:#ef4444;">提取码管理</div><div id="adminCodeList"></div><div style="font-weight:600;color:#3b82f6;">公开目录管理</div><div id="adminTreeList"></div></div>
<div class="modal-mask" id="codeModal">
  <div class="modal">
    <h3>请输入提取码</h3>
    <input type="password" id="codeInput" placeholder="提取码或管理员密码">
    <div class="btn-row">
      <!-- 直接在 HTML 里绑定点击事件，绝对生效 -->
      <button class="btn-secondary" onclick="document.getElementById('codeModal').classList.remove('show')">取消</button>
      <button class="btn-primary" onclick="handleAdminLogin()">确认</button>
    </div>
  </div>
</div><div class="modal-mask" id="iconModal"><div class="modal wide"><h3>选择图标</h3><div class="icon-grid" id="iconGrid"></div><div class="btn-row" style="margin-top:16px;justify-content:flex-end;"><button class="btn-secondary" id="closeIconModal">取消</button></div></div></div>
<div class="toast" id="toast">已复制</div>
<script>// 把下面这行换成你真实的 Worker 地址！结尾不要带斜杠！
const API_BASE = 'https://box.huanglcl7.workers.dev'; 

let clickCount = 0;
let clickTimer = null;
let adminPassword = "";

// 连点逻辑
document.getElementById('secretTrigger').addEventListener('click', function() {
  clickCount++;
  if (clickCount >= 5) {
    clickCount = 0;
    document.getElementById('codeInput').value = "";
    document.getElementById('codeModal').classList.add('show');
    setTimeout(function() { document.getElementById('codeInput').focus(); }, 100);
  } else {
    clearTimeout(clickTimer);
    clickTimer = setTimeout(function() { clickCount = 0; }, 2000);
  }
});

// 取消按钮
document.getElementById('codeCancel').addEventListener('click', function() {
  document.getElementById('codeModal').classList.remove('show');
});

// 确认按钮（核心：登录与提取逻辑）
document.getElementById('codeConfirm').addEventListener('click', async function() {
  const val = document.getElementById('codeInput').value.trim();
  if (!val) return alert('请输入密码或提取码');
  
  document.getElementById('codeModal').classList.remove('show');

  try {
    // 1. 尝试管理员登录
    const loginRes = await fetch(API_BASE + '/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: val })
    });
    const loginData = await loginRes.json();

    if (loginData.ok) {
      adminPassword = val;
      document.body.classList.add('admin-mode');
      alert('管理员登录成功！');
      loadAdminPanel();
      return;
    }

    // 2. 提取码验证
    const verifyRes = await fetch(API_BASE + '/api/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: val })
    });
    const verifyData = await verifyRes.json();

    if (verifyData.ok) {
      const area = document.getElementById('resultArea');
      const title = document.getElementById('resultTitle');
      const links = document.getElementById('resultLinks');
      
      area.classList.add('show');
      title.textContent = verifyData.data.title || '提取结果';
      
      let html = '';
      if (verifyData.data.links && verifyData.data.links.length > 0) {
        verifyData.data.links.forEach(function(l) {
          html += '<div class="link-row">' +
            '<div class="link-info"><div class="link-name">' + l.name + '</div>' +
            '<div class="link-size">' + (l.size || '') + '</div></div>' +
            '<div class="link-actions"><button class="btn-copy" onclick="navigator.clipboard.writeText(\'' + l.magnet + '\'); alert(\'已复制\')">复制磁力链接</button></div>' +
          '</div>';
        });
      } else {
        html = '<div style="text-align:center;padding:20px;">暂无内容</div>';
      }
      links.innerHTML = html;
    } else {
      alert('提取码错误！');
    }
  } catch (err) {
    alert('网络错误，无法连接后端！');
  }
});

// 加载后台数据
async function loadAdminPanel() {
  try {
    const res = await fetch(API_BASE + '/api/admin/get', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: adminPassword })
    });
    const data = await res.json();
    if (data.ok) {
      const container = document.getElementById('adminCodeList');
      // 如果后台容器是空的，说明没报错，我们随便渲染点什么证明进去了
      if (container) {
        container.innerHTML = data.data.codes.map(function(c) {
          return '<div class="admin-code-card" style="border-left:4px solid red; padding:10px; margin-bottom:10px; background:#fff;">' +
                 '<div><b>提取码：</b>' + c.code + ' | <b>标题：</b>' + (c.title || '无') + '</div>' +
                 '</div>';
        }).join('');
      }
    }
  } catch (e) {}
}

// 页面加载时拉取公开目录
window.onload = async function() {
  try {
    const res = await fetch(API_BASE + '/api/tree');
    const data = await res.json();
    if (data.ok && data.tree.length > 0) {
      const tree = document.getElementById('treeContainer');
      tree.innerHTML = data.tree.map(function(n) {
        return '<div class="tree-node-row" onclick="alert(\'你点击了：' + n.name + '\')">' + n.name + '</div>';
      }).join('');
    }
  } catch (e) {}
};
</script></body></html>
